<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>EVCharge_X - Login</title>
  <link rel="stylesheet" href="css/app-theme.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>
<body class="auth-page">

  <div class="auth-wrapper">
    <div class="auth-card-grey">
      <h2>Welcome Back!</h2>
      <p class="auth-subtitle">Login with your email and Unique ID</p>

      <div class="alert-msg" id="alertMsg"></div>
      <div id="registrationNotice" style="display:none;background:#dcfce7;border:1px solid #22c55e;color:#166534;padding:10px 14px;border-radius:10px;font-size:13px;font-weight:700;margin-bottom:14px;text-align:center;"></div>

      <form onsubmit="handleLogin(event)">
        <div style="margin-bottom: 16px;">
          <input type="email" id="emailInput" class="form-control-white" placeholder="Email Address" required>
        </div>

        <div style="margin-bottom: 16px;">
          <input type="text" id="evIdInput" class="form-control-white" placeholder="Authentication ID (e.g. EVX-AUTH-1001)" required>
        </div>

        <button type="submit" class="btn-auth-white">
          Login
        </button>

        <div style="margin-top:14px;text-align:center;">
          <button type="button" onclick="fillDemoAccount()" class="demo-fill-btn">
            ⚡ Quick Demo Driver Fill
          </button>
        </div>

        <div class="auth-footer-text">
          Don't have an account? <a href="reg.html">Sign Up</a>
        </div>
      </form>
    </div>
  </div>

  <script src="backend.js"></script>
  <script>
    const API_BASE = window.location.protocol.startsWith('http')
      ? window.location.origin
      : 'http://127.0.0.1:8080';

    function fillDemoAccount() {
      document.getElementById('emailInput').value = 'driver@evcharge.com';
      document.getElementById('evIdInput').value = 'EVX-AUTH-1001';
    }

    window.addEventListener('DOMContentLoaded', async function() {
      await EVChargeApp._initializeStorage();
      const params = new URLSearchParams(window.location.search);
      const registeredId = localStorage.getItem('evcharge_last_registered_id');
      const registeredEmail = localStorage.getItem('evcharge_last_registered_email');
      if (params.get('registered') === '1' && registeredId) {
        document.getElementById('emailInput').value = registeredEmail || '';
        document.getElementById('evIdInput').value = registeredId;
        const notice = document.getElementById('registrationNotice');
        notice.textContent = `Registration successful. Your Unique ID is ${registeredId}`;
        notice.style.display = 'block';
      }
      if (EVChargeApp.isLoggedIn()) {
        window.location.href = 'home.html';
      }
    });

    async function handleLogin(e) {
      e.preventDefault();
      const email = document.getElementById('emailInput').value.trim();
      const evID = document.getElementById('evIdInput').value.trim().toUpperCase();

      if (!email || !evID) {
        showError('Please enter your email and Unique ID.');
        return;
      }

      let loginSuccess = false;
      let user = null;

      try {
        const response = await fetch(`${API_BASE}/api/login`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email, evID })
        });
        if (response.ok) {
          const data = await response.json();
          if (data.token) localStorage.setItem('evcharge_token', data.token);
          user = data.user;
          loginSuccess = true;
        }
      } catch (err) {
        console.info('Node server offline. Using local client database...');
      }

      if (!loginSuccess) {
        await EVChargeApp._initializeStorage();
        const usersDB = EVChargeApp.getAllUsers();
        const found = Object.values(usersDB).find(u => 
          u.evID?.toUpperCase() === evID &&
          (!email || !u.email || u.email.toLowerCase() === email.toLowerCase())
        );

        if (found) {
          user = found;
          loginSuccess = true;
        } else {
          const current = EVChargeApp.getUserProfile();
          if (current && (current.evID?.toUpperCase() === evID || current.email?.toLowerCase() === email.toLowerCase())) {
            user = current;
            loginSuccess = true;
          } else if (evID.startsWith('EVX-') || evID.length >= 4) {
            user = EVChargeApp.saveUserProfile({
              fullName: email.split('@')[0] || 'EV Driver',
              email: email,
              evID: evID
            });
            loginSuccess = true;
          }
        }
      }

      if (loginSuccess && user) {
        localStorage.setItem('evcharge_logged_in', 'true');
        localStorage.setItem('evcharge_user', JSON.stringify(user));
        localStorage.setItem('evcharge_current_user_id', user.evID || evID);
        EVChargeApp.saveUserProfile(user);
        window.location.href = 'home.html';
      } else {
        showError('Invalid ID or Email! Please register first if you do not have an ID.');
      }
    }

    function showError(msg) {
      const alertBox = document.getElementById('alertMsg');
      alertBox.innerText = msg;
      alertBox.style.display = 'block';
      setTimeout(() => alertBox.style.display = 'none', 4000);
    }
  </script>
</body>
</html>
